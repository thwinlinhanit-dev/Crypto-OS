# config/defaults.yaml — the ONLY source of parameter defaults (PD-11).
#
# A parameter that is neither listed here nor supplied by the request is
# rejected with HTTP 422 VALIDATION_ERROR. Nothing may be invented: every key
# below cites the spec section that documents it.
#
# schema_version guards the shape of this file itself.

schema_version: 1

data:
  # Section 16 OD-5 - Storage budget GB; "ingest refuses to exceed" it.
  # Operational guard, not a research parameter: PD-11 still routes it through
  # this file (only "the request, or config/defaults.yaml" may supply defaults).
  storage_budget_gb: 20

candles:
  # IMPLEMENTATION_SPEC section 11 GET /v1/candles limit; section 14.3 names
  # 5,000 candles as the chart working set and the API performance target.
  default_limit: 5000
  max_limit: 5000

indicators:
  # IMPLEMENTATION_SPEC section 5 + section 11 GET /v1/indicators (M2 registry).
  # `null` = documented but no default: the request must supply it (PD-11);
  # sections that give a number (Bollinger(20, 2), rvol(n=20)) carry it here.
  sma:
    length: null
  ema:
    length: null
  atr:
    length: null
  rsi:
    length: null # section 5 defines no default length - OQ-8
  vwap: {}
  cpos: {}
  upper_wick: {}
  bb:
    length: 20
    mult: 2.0
  rvol:
    length: 20
  # M3 — the rest of the section 5 set (spec line 241 "MACD(12,26,9),
  # ... ADX(14)"). `null` means section 5 pins no window for that feature, so
  # none is invented here; the request must supply it (PD-11).
  rma:
    length: null
  tr: {}
  highest:
    length: null
    source: high # section 6.3 and the reference study read highs
  lowest:
    length: null
    source: low
  donchian_lo:
    length: null
  donchian_hi:
    length: null
  pivotlow:
    left: null
    right: null
    source: low # reference study plv = ta.pivotlow(low, ...)
  pivothigh:
    left: null
    right: null
    source: high # reference study phv = ta.pivothigh(high, ...)
  macd:
    fast: 12
    slow: 26
    signal: 9 # spec section 5 line 241: MACD(12,26,9)
  adx:
    length: 14 # spec section 5 line 241: ADX(14)

features:
  # IMPLEMENTATION_SPEC section 5 line 242 — regime tags: deterministic,
  # documented, descriptive only. They label the event `regime{}` payload
  # (section 6.2); they are never a filter, threshold or trading rule
  # (docs/DECISIONS.md D-017). Engine-defined edges are marked as such below.
  trend_state:
    length: 100 # regime_len of specs/reference/rvol_climax_pro_v5.pine
    slope_lag: 5 # inDown compares emaR against emaR[5] (line 123)
  vol_state:
    atr_length: 14 # atr_len of the reference study (section 6.3)
    window: 252 # trailing-year percentile window; edges 33/67 are engine-defined
  volume_state:
    length: 20 # vol_len (section 6.3); edges 0.5/1.0 engine-defined, 2.0/3.0 spec

detectors:
  rvol_climax_v5:
    # IMPLEMENTATION_SPEC section 6.3 - Detector RVOL_CLIMAX v5.0
    vol_len: 20
    climax_mult: 3.0
    top_mult: 2.0
    range_len: 20
    trend_len: 5
    close_pos_lo: 0.30
    close_pos_hi: 0.70
    regime_len: 100
    bounce_len: 10
    bounce_atr: 1.5
    wick_min: 0.40
    cooldown: 5
    atr_len: 14
    fail_mode: "failed_bounce" # alternative "legacy_v1" (see docs/DECISIONS.md OQ-2)
    lookback_bars: 100

stats:
  # IMPLEMENTATION_SPEC section 8.2 - StatsResult computation defaults.
  # Keys with a null default are DERIVED at request resolution from a rule the
  # spec states (not invented); the resolver fills them before merge:
  #   embargo_bars: section 8.1 step 2 "E = embargo_bars (default = H)"
  #                 with H = max horizon in view.
  #   market_event_k: section 8.2 "k = max(3, 10% of universe)".
  #   cluster_models: section 8.2 detector default ASSUMPTION, read from
  #                 cluster_models_by_detector below when the request omits it.
  horizons: [1, 2, 3, 5, 10, 15, 20, 30, 40, 50] # section 6.4 frozen list
  bootstrap_resamples: 5000 # section 8.2 "seeded cluster-bootstrap 95% CI (5000 resamples)"
  bootstrap_seed: 1 # section 8.2 "seed stored" - fixed seed = reproducible (PD-6)
  embargo_bars: null # derived: default = H (section 8.1)
  market_event_k: null # derived: default = max(3, 10% of universe) (section 8.2)
  cluster_models: null # derived: detector default from cluster_models_by_detector
  cluster_models_by_detector:
    # The detector's documented default cluster_model ASSUMPTION (section 6.3
    # detector spec; "SYMBOL_GAP + CALENDAR_WEEK" on rvol_climax.py).
    RVOL_CLIMAX: [SYMBOL_GAP, CALENDAR_WEEK]
